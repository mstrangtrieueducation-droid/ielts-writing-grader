name: Automated IELTS Writing Grader
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate access first, or run grading'
        type: choice
        options: [preflight, pilot, collect-pro-batch, deliver-pilot, deliver-pilot-notebook, deliver-teacher-authorized, grade]
        default: preflight
      authorized_flash_trial:
        description: 'Explicitly authorized bounded Flash pilot; leaves scheduled generation off'
        type: boolean
        default: false
      authorized_hybrid_trial:
        description: 'Explicitly approved one-student Pro Flex pilot; preserves generation OFF for scheduled runs'
        type: boolean
        default: false
      authorized_flash_bundle_trial:
        description: 'Approved one-call Flash two-essay pilot; keeps scheduled generation OFF'
        type: boolean
        default: false
      authorized_pro_batch_trial:
        description: 'New explicit Pro Batch pilot approval; never retries a saved submission'
        type: boolean
        default: false
      authorized_pro_standard_trial:
        description: 'Explicitly approved immediate one-student Pro Standard pilot'
        type: boolean
        default: false
      pro_output_limit:
        description: 'Output plus thinking limit from the explicitly approved Standard pilot plan'
        type: choice
        options: ['8192','16384']
        default: '8192'
      hybrid_student_budget_vnd:
        description: 'Approved cumulative student ceiling for this pilot, including prior paid trials'
        type: string
        default: '1000'
  repository_dispatch:
    types: [new_scan_uploaded, on_form_submit]
permissions:
  contents: write
  pages: write
concurrency:
  group: ielts-grading-single-writer
  cancel-in-progress: false
jobs:
  grade:
    # Uploading source code alone must not silently activate paid grading or live writes.
    if: vars.GRADING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_GENERATION_ENABLED: ${{ (inputs.mode == 'collect-pro-batch' || inputs.mode == 'deliver-pilot' || inputs.mode == 'deliver-pilot-notebook' || inputs.mode == 'deliver-teacher-authorized') && 'false' || inputs.mode == 'pilot' && (inputs.authorized_flash_trial || inputs.authorized_hybrid_trial || inputs.authorized_flash_bundle_trial || inputs.authorized_pro_batch_trial || inputs.authorized_pro_standard_trial) && 'true' || vars.GEMINI_GENERATION_ENABLED }}
      PILOT_BATCH_SUBMIT_AUTHORIZED: ${{ inputs.mode == 'pilot' && inputs.authorized_pro_batch_trial && 'true' || 'false' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_STATE_OAUTH_JSON: ${{ secrets.GOOGLE_STATE_OAUTH_JSON }}
      DASHBOARD_MASTER_KEY: ${{ secrets.DASHBOARD_MASTER_KEY }}
      FOLDER_INCOMING_SCAN_ID: ${{ vars.FOLDER_INCOMING_SCAN_ID }}
      FOLDER_PROCESSED_SCAN_ID: ${{ vars.FOLDER_PROCESSED_SCAN_ID }}
      FOLDER_STATE_ID: ${{ vars.FOLDER_STATE_ID }}
      GUIDELINES_SPREADSHEET_ID: ${{ vars.GUIDELINES_SPREADSHEET_ID }}
      GEMINI_NOTEBOOK_MODEL: ${{ vars.GEMINI_NOTEBOOK_MODEL }}
      # The earlier Flash-only trial authorization must never authorize a Pro call.
      GEMINI_ESSAY_MODEL: ${{ inputs.mode == 'pilot' && (inputs.authorized_flash_trial || inputs.authorized_flash_bundle_trial) && 'gemini-3.8-flash' || (inputs.mode == 'collect-pro-batch' || inputs.mode == 'pilot' && (inputs.authorized_hybrid_trial || inputs.authorized_pro_batch_trial || inputs.authorized_pro_standard_trial)) && 'gemini-3.1-pro-preview' || vars.GEMINI_ESSAY_MODEL }}
      GEMINI_ESSAY_BUNDLE: ${{ inputs.mode == 'pilot' && inputs.authorized_flash_bundle_trial && 'true' || vars.GEMINI_ESSAY_BUNDLE || 'false' }}
      GEMINI_PRO_MAX_OUTPUT_TOKENS: ${{ inputs.mode == 'pilot' && inputs.authorized_pro_standard_trial && inputs.pro_output_limit || '8192' }}
      GEMINI_ESSAY_SERVICE_TIER: ${{ inputs.mode == 'pilot' && inputs.authorized_pro_standard_trial && 'standard' || (inputs.mode == 'collect-pro-batch' || inputs.mode == 'pilot' && inputs.authorized_pro_batch_trial) && 'batch' || inputs.mode == 'pilot' && inputs.authorized_flash_bundle_trial && 'standard' || inputs.mode == 'pilot' && inputs.authorized_hybrid_trial && !inputs.authorized_flash_trial && 'flex' || vars.GEMINI_ESSAY_SERVICE_TIER || 'standard' }}
      GEMINI_STUDENT_BUDGET_VND: ${{ (inputs.mode == 'collect-pro-batch' || inputs.mode == 'pilot' && (inputs.authorized_hybrid_trial || inputs.authorized_flash_bundle_trial || inputs.authorized_pro_batch_trial || inputs.authorized_pro_standard_trial)) && !inputs.authorized_flash_trial && inputs.hybrid_student_budget_vnd || vars.GEMINI_STUDENT_BUDGET_VND || '1000' }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      CLASS_SHEET_MAP_JSON: ${{ secrets.CLASS_SHEET_MAP_JSON }}
      PILOT_SELECTION_JSON: ${{ secrets.PILOT_SELECTION_JSON }}
      GRADING_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAX_JOBS_PER_RUN: '12'
      GEMINI_RPM: '6'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify rules and recovery
        run: python -m pytest -q
      - name: Install dashboard verification browser
        run: python -m playwright install --with-deps chromium
      - name: Verify dashboard rendering with synthetic fixtures
        run: python tests/ui_smoke.py
      - name: Validate API access
        run: python -m src.main --preflight
      - name: Grade and verify delivery
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'grade'
        run: python -m src.main
      - name: Grade selected real pilot privately
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot'
        run: python -m src.main --pilot
      - name: Collect the saved Pro Batch pilot without generation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect-pro-batch'
        run: python -m src.main --collect-pro-batch
      - name: Deliver approved saved pilot without generation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-pilot'
        run: python -m src.main --deliver-pilot
      - name: Return independently verified notebook while essays remain held
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-pilot-notebook'
        run: python -m src.main --deliver-pilot-notebook
      - name: Publish exact saved output on explicit teacher instruction
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-teacher-authorized'
        run: python -m src.main --deliver-teacher-authorized
