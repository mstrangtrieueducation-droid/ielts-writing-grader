name: Automated IELTS Writing Grader
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate, collect saved batches, deliver saved output, or submit new per-essay batches'
        type: choice
        options: [preflight, pilot, collect-batches, collect-pro-batch, deliver-pilot, deliver-pilot-notebook, deliver-teacher-authorized, grade]
        default: preflight
  repository_dispatch:
    types: [new_scan_uploaded, on_form_submit]
permissions:
  contents: write
  pages: write
concurrency:
  group: ielts-grading-single-writer
  cancel-in-progress: false
jobs:
  grade:
    # Collection must continue with paid generation disabled. Its CLI gates live
    # dashboard/Sheets delivery separately on GRADING_ENABLED.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRADING_ENABLED: ${{ vars.GRADING_ENABLED || 'false' }}
      GEMINI_GENERATION_ENABLED: ${{ (inputs.mode == 'collect-batches' || inputs.mode == 'collect-pro-batch' || inputs.mode == 'deliver-pilot' || inputs.mode == 'deliver-pilot-notebook' || inputs.mode == 'deliver-teacher-authorized') && 'false' || vars.GEMINI_GENERATION_ENABLED || 'false' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_STATE_OAUTH_JSON: ${{ secrets.GOOGLE_STATE_OAUTH_JSON }}
      DASHBOARD_MASTER_KEY: ${{ secrets.DASHBOARD_MASTER_KEY }}
      FOLDER_INCOMING_SCAN_ID: ${{ vars.FOLDER_INCOMING_SCAN_ID }}
      FOLDER_PROCESSED_SCAN_ID: ${{ vars.FOLDER_PROCESSED_SCAN_ID }}
      FOLDER_STATE_ID: ${{ vars.FOLDER_STATE_ID }}
      GUIDELINES_SPREADSHEET_ID: ${{ vars.GUIDELINES_SPREADSHEET_ID }}
      GEMINI_NOTEBOOK_MODEL: ${{ vars.GEMINI_NOTEBOOK_MODEL }}
      # Saved legacy jobs keep their frozen contract. New grade/collection runs
      # cannot be redirected to Standard/Flex by stale repository variables.
      GEMINI_ESSAY_REQUEST_MODE: ${{ (inputs.mode == 'collect-pro-batch' || inputs.mode == 'deliver-pilot' || inputs.mode == 'deliver-pilot-notebook' || inputs.mode == 'deliver-teacher-authorized') && 'legacy' || 'per_essay_batch' }}
      GEMINI_ESSAY_MODEL: 'gemini-3.1-pro-preview'
      GEMINI_ESSAY_BUNDLE: 'false'
      GEMINI_PRO_MAX_OUTPUT_TOKENS: ${{ (inputs.mode == 'collect-pro-batch' || inputs.mode == 'deliver-pilot' || inputs.mode == 'deliver-pilot-notebook' || inputs.mode == 'deliver-teacher-authorized') && '8192' || '16384' }}
      GEMINI_ESSAY_SERVICE_TIER: 'batch'
      GEMINI_STUDENT_BUDGET_VND: ${{ vars.GEMINI_STUDENT_BUDGET_VND || '1000' }}
      DASHBOARD_BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
      CLASS_SHEET_MAP_JSON: ${{ secrets.CLASS_SHEET_MAP_JSON }}
      PILOT_SELECTION_JSON: ${{ secrets.PILOT_SELECTION_JSON }}
      GRADING_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MAX_JOBS_PER_RUN: '12'
      GEMINI_RPM: '6'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install dashboard verification browser
        run: python -m playwright install --with-deps chromium
      - name: Verify rules and recovery
        run: python -m pytest -q
      - name: Verify dashboard rendering with synthetic fixtures
        run: python tests/ui_smoke.py
      - name: Validate API access
        id: preflight
        run: python -m src.main --preflight
      - name: Collect saved per-essay batches and finish verified delivery
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect-batches' || inputs.mode == 'grade'
        env:
          GEMINI_GENERATION_ENABLED: 'false'
        run: python -m src.main --collect-batches
      - name: Grade and verify delivery
        # A held paid result remains a visible collector failure, but cannot block
        # unrelated new work. Tests/setup/preflight failures and cancellation still stop grading.
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'grade') && vars.GRADING_ENABLED == 'true' && vars.GEMINI_GENERATION_ENABLED == 'true' }}
        run: python -m src.main
      - name: Grade selected real pilot privately
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot' && vars.GRADING_ENABLED == 'true' && vars.GEMINI_GENERATION_ENABLED == 'true'
        run: python -m src.main --pilot
      - name: Collect the saved Pro Batch pilot without generation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect-pro-batch'
        run: python -m src.main --collect-pro-batch
      - name: Deliver approved saved pilot without generation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-pilot'
        run: python -m src.main --deliver-pilot
      - name: Return independently verified notebook while essays remain held
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-pilot-notebook'
        run: python -m src.main --deliver-pilot-notebook
      - name: Publish exact saved output on explicit teacher instruction
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver-teacher-authorized'
        run: python -m src.main --deliver-teacher-authorized
